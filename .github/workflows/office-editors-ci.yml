name: Office editors CI

on:
  push:
    branches:
      - "feature/office-editors"
  pull_request:
    paths:
      - "backend/app/services/office.py"
      - "backend/app/services/office_word.py"
      - "backend/app/services/office_excel.py"
      - "backend/app/schemas.py"
      - "backend/tests/test_office*.py"
      - "frontend/components/OfficeEditor.tsx"
      - "frontend/components/OfficePanel.tsx"
      - "frontend/components/WordStudio.tsx"
      - "frontend/components/WordStudio.module.css"
      - "frontend/components/SpreadsheetStudio.tsx"
      - "frontend/components/SpreadsheetStudio.module.css"
      - ".github/workflows/office-editors-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest -q backend/tests/test_office.py backend/tests/test_office_word.py backend/tests/test_office_excel.py
      - run: npm --prefix frontend run build
