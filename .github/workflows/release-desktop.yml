name: Desktop release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/*.AppImage.blockmap
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
          - os: macos-latest
            platform: macos
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
              desktop/dist/latest-mac.yml
          - os: windows-latest
            platform: windows
            artifacts: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt "pyinstaller>=6,<7"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Build API sidecar
        run: python desktop/scripts/build_backend.py
      - name: Build frontend bundle
        run: npm --prefix desktop run prepare:app
      - name: Smoke-test packaged services
        run: python desktop/scripts/smoke_release.py
      - name: Package Linux
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Package macOS
        if: matrix.platform == 'macos'
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never
      - name: Package Windows
        if: matrix.platform == 'windows'
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Olladex-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${GITHUB_REF#refs/heads/release/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
